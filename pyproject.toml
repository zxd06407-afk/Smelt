[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smelt"
version = "0.1.0"
description = "WGBS methylation downstream analysis tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyfaidx>=0.7",
    "structlog>=23.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
[project.scripts]
smelt = "smelt.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
